; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = beeptronics

[env]
; Keep the known Arduino 2.x/LEDC and NimBLE 1.x APIs during this refactor.
platform = espressif32 @ 6.3.2
board = beeptronics_s3_n16
framework = arduino
board_build.partitions = partitions/16mb.csv
monitor_speed = 115200
lib_deps =
    fastled/FastLED @ 3.6.0
    thomasfredericks/Bounce2 @ 2.72
    h2zero/NimBLE-Arduino @ 1.4.1
build_src_filter = +<*> -<build/>
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:beeptronics]

[env:beeptronics_simulation]
build_flags =
    ${env.build_flags}
    -DBEEPTRONICS_SIMULATION=1
